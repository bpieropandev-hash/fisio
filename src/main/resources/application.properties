# Carrega um arquivo .env na raiz do projeto (opcional). Permite que vari?veis definidas em .env sejam usadas em tempo de execu??o
spring.config.import=optional:dotenv:

server.port=${SERVER_PORT:8080}

# Java 21: threads virtuais para requests HTTP (Tomcat) e datasource pool (P3.2)
spring.threads.virtual.enabled=true

# Fotos clínicas privadas: limite por arquivo de 5 MiB e margem para campos multipart.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fisio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE:America/Sao_Paulo}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:master}
# open-in-view=true (default) de propósito: várias camadas (mappers MapStruct, services) acessam
# associações @ManyToOne LAZY (paciente/assinatura/serviço) fora da transação do repository sem
# JOIN FETCH em todo lugar. Desligar isso sem antes auditar/corrigir cada query quebra em cascata
# (LazyInitializationException) — já aconteceu, ver specs/03-melhorias.md.
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:true}

# Hikari (connection pool)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}

# Flyway: when the database schema already exists but has no flyway_schema_history,
# baseline the existing schema so migrations can continue. Defaults may be overridden
# with environment variables for CI/production.
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
# Use version 0 as baseline so existing V0 migrations are treated as applied and
# subsequent migrations (V1, V2, ...) will be executed. Change via env var if needed.
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}
# Ensure Flyway targets the same schema used by JPA (default: master)
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:master}

# Logging levels
logging.level.com.physio=${LOGGING_LEVEL_COM_PHYSIO:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER:WARN}

# Application secrets / tokens
# Sem valor padrão de proposito: a aplicacao NAO sobe sem API_SECURITY_TOKEN_SECRET
# definida (minimo 32 caracteres - validado no TokenService).
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:}

# Email (SMTP) - reset de senha nativo (spec 05). Provedor sugerido: Resend ou
# Brevo (free tier), ambos expõem relay SMTP compatível com spring-boot-starter-mail.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:no-reply@physio-manager.com}

# URL do frontend, usada para montar o link de redefinição de senha
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Identidade da clínica, usada no cabeçalho dos relatórios PDF (spec 07 F6)
relatorio.clinica.nome=${RELATORIO_CLINICA_NOME:Physio Manager}
relatorio.profissional.nome=${RELATORIO_PROFISSIONAL_NOME:}
relatorio.profissional.crefito=${RELATORIO_PROFISSIONAL_CREFITO:}

# Actuator: só health exposto (Railway liveness), sem detalhes sensíveis
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Sem isso, o health geral cai pra DOWN sempre que SMTP não está configurado
# (comum: local sem .env de mail, e produção até configurar spec 05) mesmo com
# a aplicação e o banco 100% saudáveis — falso negativo que derrubaria o container.
management.health.mail.enabled=false

# Identificação congelada no snapshot de cada recibo interno
recibo.emitente.nome=${RECIBO_EMITENTE_NOME:}
recibo.emitente.documento=${RECIBO_EMITENTE_DOCUMENTO:}
