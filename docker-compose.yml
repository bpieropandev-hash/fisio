services:
  # O Banco de Dados
  db:
    image: postgres:17-alpine
    container_name: physio_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: physio_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bootstrap na primeira subida: cria o schema "master" e aplica as
      # migrações V0..Vn em ordem (o entrypoint do postgres executa os .sql
      # de /docker-entrypoint-initdb.d em ordem alfabética).
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
      - ./scripts/docker-init/00_create_schema.sql:/docker-entrypoint-initdb.d/00_create_schema.sql:ro

  # Interface visual para gerenciar o banco (acesso via navegador)
  pgadmin:
    image: dpage/pgadmin4
    container_name: physio_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
